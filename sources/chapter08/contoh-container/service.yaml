# Service contoh Bab 08: satu alamat tetap untuk pod jadwal-dokter.
# Pakai: kubectl apply -f service.yaml sesudah deployment.yaml.
apiVersion: v1
kind: Service
metadata:
  name: jadwal-dokter
spec:
  # Pod datang dan pergi; alamat Service tetap. Pemanggil tidak perlu
  # tahu pod mana yang sedang hidup.
  selector:
    app: jadwal-dokter
  ports:
    - port: 80
      targetPort: 8080
